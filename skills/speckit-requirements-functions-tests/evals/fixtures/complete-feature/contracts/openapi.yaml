openapi: 3.1.0
info:
  title: Delivery Request API
  version: 1.0.0
paths:
  /delivery-requests:
    post:
      operationId: createDeliveryRequest
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination: {type: string}
      responses:
        '201': {description: Created}
        '200': {description: First result for a repeated idempotency key}
        '400': {description: Invalid request}
  /delivery-requests/{requestId}/status:
    patch:
      operationId: updateDeliveryStatus
      parameters:
        - in: path
          name: requestId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Updated}
        '409': {description: Transition rejected or version conflict}
