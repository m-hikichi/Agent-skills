openapi: 3.1.0
info:
  title: Order Integration API
  version: 1.0.0
  description: 注文受付、状態変更、隔離イベント再送の契約
servers:
  - url: https://api.example.invalid/v1
security:
  - oauth2ClientCredentials: []
paths:
  /orders:
    post:
      operationId: createOrder
      summary: 注文を冪等に受け付ける
      security:
        - oauth2ClientCredentials: [orders.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 初回受付
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAccepted'
        '200':
          description: 同じ冪等キー・同じpayloadの初回結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: 同じ冪等キーでpayloadが異なる
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.example.invalid/idempotency-conflict
                title: Idempotency key conflict
                status: 409
                code: IDEMPOTENCY_CONFLICT
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{orderId}/transitions:
    post:
      operationId: transitionOrder
      summary: 許可された注文状態へ変更する
      security:
        - oauth2ClientCredentials: [orders.transition]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionOrderRequest'
      responses:
        '200':
          description: 状態変更完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderState'
        '409':
          description: 禁止遷移またはversion競合
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
  /operations/events/{eventId}/replay:
    post:
      operationId: replayDeadLetterEvent
      summary: 隔離イベントを同じevent IDで手動再送する
      security:
        - oauth2ClientCredentials: [events.replay]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '202':
          description: 同じevent IDをpendingへ戻した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayAccepted'
        '409':
          description: dead-letterでない、または既に再送中
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
webhooks:
  orderStatusChanged:
    post:
      operationId: receiveOrderStatusChanged
      summary: 外部ECへ注文状態変更を通知する
      parameters:
        - name: X-Event-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChangedEvent'
      responses:
        '204':
          description: 受信済み。重複event IDも同じ結果を返す
        '400':
          description: 再送しても解消しないschema違反
        '401':
          description: 認証失敗
        '429':
          description: 一時的なrate limit。自動再送対象
        '500':
          description: 一時的な受信失敗。自動再送対象
x-external-operations:
  dailyOrderCount:
    method: GET
    path: /v1/reconciliation/orders/count
    auth: oauth2-client-credentials
    scope: reconciliation.read
    query:
      targetDate: { type: string, format: date, timezone: Asia/Tokyo }
    success:
      status: 200
      body:
        type: object
        required: [targetDate, count]
        properties:
          targetDate: { type: string, format: date }
          count: { type: integer, minimum: 0 }
    retry:
      attempts: 1
      on: [429, 500, 502, 503, 504]
    recovery: 照合不能として記録し運用担当へ通知する
components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.invalid/oauth2/token
          scopes:
            orders.write: 注文登録
            orders.transition: 注文状態変更
            events.replay: 隔離イベント手動再送
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: clientごとに30日間保持する冪等キー
  responses:
    InvalidRequest:
      description: request schema違反
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: client認証またはscope不足
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 対象resourceなし
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [externalOrderNumber, lines, destination]
      properties:
        externalOrderNumber: { type: string, minLength: 1, maxLength: 64 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLine' }
        destination: { $ref: '#/components/schemas/Destination' }
    OrderLine:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku: { type: string, minLength: 1, maxLength: 64 }
        quantity: { type: integer, minimum: 1 }
    Destination:
      type: object
      additionalProperties: false
      required: [postalCode, address1, recipientName]
      properties:
        postalCode: { type: string, pattern: '^[0-9]{7}$' }
        address1: { type: string, minLength: 1, maxLength: 200 }
        address2: { type: string, maxLength: 200 }
        recipientName: { type: string, minLength: 1, maxLength: 100 }
    OrderAccepted:
      type: object
      required: [orderId, status, acceptedAt]
      properties:
        orderId: { type: string, format: uuid }
        status: { const: accepted }
        acceptedAt: { type: string, format: date-time }
    TransitionOrderRequest:
      type: object
      additionalProperties: false
      required: [targetStatus, version, triggerRef]
      properties:
        targetStatus:
          type: string
          enum: [shipping, delivered, cancelled]
        version: { type: integer, minimum: 0 }
        triggerRef: { type: string, minLength: 1, maxLength: 128 }
    OrderState:
      type: object
      required: [orderId, status, version, changedAt]
      properties:
        orderId: { type: string, format: uuid }
        status:
          type: string
          enum: [accepted, shipping, delivered, cancelled]
        version: { type: integer, minimum: 1 }
        changedAt: { type: string, format: date-time }
    OrderStatusChangedEvent:
      type: object
      additionalProperties: false
      required: [eventId, orderId, previousStatus, currentStatus, changedAt]
      properties:
        eventId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        previousStatus:
          type: string
          enum: [accepted, shipping]
        currentStatus:
          type: string
          enum: [shipping, delivered, cancelled]
        changedAt: { type: string, format: date-time }
    ReplayAccepted:
      type: object
      required: [eventId, status]
      properties:
        eventId: { type: string, format: uuid }
        status: { const: pending }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
